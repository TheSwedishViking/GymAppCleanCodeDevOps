name: 'Build and validate before merge ‼️🫠🤸‍♀️'
env:
    net_v: '10.0.x'
    slnx_path: 'GymSwipe/GymSwipe.slnx'
on:
  workflow_dispatch: 
  pull_request: 
    branches:
      - main

jobs:
  GenerateSBOM:
    runs-on: ubuntu-latest
    steps:
        - name: Checkout le repo 👀 
          uses: actions/checkout@v4
          
        - name: Generate le SBOM 📃
          uses: advanced-security/generate-sbom-action@v1
          id: gensbom
          
        - name: Upload le artifact ⬆️
          uses: actions/upload-artifact@v4
          with:
            name: sbom
            path: ${{ steps.gensbom.outputs.fileName }}
            
        - name: Send le SBOM over to Discord via webhook 🪻
          env:
            WEBHOOK: ${{secrets.DISCORD_WEBHOOK}}
            SBOM_FILE: ${{ steps.gensbom.outputs.fileName }}
            REPO: ${{github.repository}}
          run: |
              echo "Sending SBOM over to discord!"
              curl -sS -f \
              -F "payload_json={\"content\": \"SBOM for ${{env.REPO}}🍋🍋🍋 (run ${{ github.run_number }})\"}" \
              -F "file=@${{env.SBOM_FILE}}" \
              ${{env.WEBHOOK}}"
              
  BuildJob:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout the repo 👀  
        uses: actions/checkout@v4

      - name: Setup .Net 🪻🟪
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{env.net_v}}
          
      - name: Install Workloads (for maui) 🤬
        run: dotnet workload restore ${{env.slnx_path}}
          
      - name: Restore 🦒
        run: dotnet restore ${{env.slnx_path}}
          
      - name: Build 🛠️ 
        run: |
          echo "Building!"
          dotnet build ${{env.slnx_path}} --no-restore --configuration Release
      - name: Run Tests 📈📉
        run: |
          echo "Running tests"
          dotnet test ${{env.slnx_path}} --no-build --configuration Release
      
