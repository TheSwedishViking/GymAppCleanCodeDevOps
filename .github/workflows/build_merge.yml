name: 'Build and validate before merge ‼️🫠🤸‍♀️'
on:
  pull_request: 
    branches:
      - main
jobs:
  BuildJob:
    runs-on: ubuntu-latest
    env:
      net_v: '10.0.x'
    steps:
      - name: Checkout the repo 👀  
        uses: actions/checkout@v4

      - name: Setup .Net 🪻🟪
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{env.net_v}}
      - name: Restore 🦒
        run: dotnet restore
          
      - name: Build 🛠️ 
        run: |
          echo "Building!"
          dotnet build --no-restore --configuration Release
      - name: Run Tests 📈📉
        run: |
          echo "Running tests"
          dotnet test --no-build --configuration Release
